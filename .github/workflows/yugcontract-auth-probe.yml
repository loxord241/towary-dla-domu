# TEMPORARY DIAGNOSTIC WORKFLOW (OPS stage 3.2).
#
# Single purpose: determine whether Yugcontract accepts authentication
# requests originating from a GitHub-hosted runner, using the same
# production auth endpoint and the same HS256 signing contract as
# app/lib/yugcontract/client.ts (reusing app/lib/yugcontract/jwt.ts).
#
# NO importer execution, NO Supabase access, NO DB writes.
# Dispatch-only; remove after diagnosis.
name: Yugcontract auth probe (temporary diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Auth-only probe: exactly replicates getAuthToken()'s HTTP request
      # (same default endpoint, same JWT shape/ttl 180s, same body).
      # Prints ONLY: status, elapsed, whitelisted machine-safe fields,
      # runner metadata, egress IP. Never prints keys, JWT or full body.
      - name: Auth-only probe
        env:
          YUGCONTRACT_USER_KEY: ${{ secrets.YUGCONTRACT_USER_KEY }}
          YUGCONTRACT_SECRET: ${{ secrets.YUGCONTRACT_SECRET }}
        run: |
          node --input-type=module <<'PROBE'
          import { signHs256Jwt } from './app/lib/yugcontract/jwt.ts';

          const url =
            process.env.YUGCONTRACT_AUTH_URL ??
            'https://auth.yugcontract.ua/api/auth/get-auth-token';
          const userKey = process.env.YUGCONTRACT_USER_KEY?.trim() ?? '';
          const secret = process.env.YUGCONTRACT_SECRET?.trim() ?? '';
          if (!userKey || !secret) {
            console.log('kind: config — missing credentials');
            process.exit(1);
          }

          const requestToken = signHs256Jwt(
            { algorithm: 'HS256', user_key: userKey },
            secret,
            180
          );

          const t0 = Date.now();
          try {
            const r = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ requestToken }),
              signal: AbortSignal.timeout(30_000),
            });
            console.log('http_status:', r.status);
            console.log('elapsed_ms:', Date.now() - t0);
            if (r.status === 401 || r.status === 403)
              console.log('auth_rejected: true');

            let j = null;
            try {
              j = await r.json();
            } catch {}

            const top = ['result', 'code', 'error_code', 'errorCode', 'status_code', 'statusCode'];
            for (const k of top) {
              if (j && typeof j === 'object' && j[k] !== undefined) {
                console.log(`safe_field[${k}]:`, JSON.stringify(j[k]).slice(0, 120));
              }
            }
            const err = j && typeof j === 'object' ? j.error : null;
            if (err && typeof err === 'object') {
              for (const k of ['code', 'type', 'kind']) {
                if (typeof err[k] === 'string' || typeof err[k] === 'number')
                  console.log(`safe_error[${k}]:`, String(err[k]).slice(0, 200));
              }
            }
          } catch (e) {
            console.log('elapsed_ms:', Date.now() - t0);
            const timeouty = e.name === 'TimeoutError' || e.name === 'AbortError';
            console.log('class:', timeouty ? 'timeout/upstream' : 'network/connectivity');
          }

          console.log('run_id:', process.env.GITHUB_RUN_ID ?? 'unknown');
          console.log('ref:', process.env.GITHUB_REF ?? 'unknown');
          console.log('runner_os:', process.env.RUNNER_OS ?? 'unknown');
          console.log('runner_arch:', process.env.RUNNER_ARCH ?? 'unknown');
          console.log(
            'runner_image:',
            `${process.env.ImageOS ?? 'unknown'} ${process.env.ImageVersion ?? ''}`.trim()
          );
          try {
            const t = (await (await fetch('https://checkip.amazonaws.com')).text()).trim();
            const ip = /^[0-9a-fA-F:.]+$/.test(t) ? t : 'UNKNOWN';
            console.log('egress_ip:', ip);
          } catch {
            console.log('egress_ip: UNKNOWN');
          }
          PROBE
